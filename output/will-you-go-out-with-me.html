<!DOCTYPE html>
<html lang=""en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Go Out With Me? 💖</title><title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose:      #f472b6;
    --rose-deep: #ec4899;
    --blush:     #fce7f3;
    --petal:     #fbcfe8;
    --cream:     #fff7f9;
    --lilac:     #e9d5ff;
    --mint:      #d1fae5;
    --gold:      #fbbf24;
    --glass-bg:  rgba(255,255,255,0.55);
    --glass-border: rgba(255,182,210,0.45);
    --shadow:    0 8px 40px rgba(236,72,153,0.18);
  }

  html, body {
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #fff0f6 0%, #fce7f3 30%, #ede9fe 65%, #fdf2f8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    padding: 1.5rem;
  }

  /* ── BACKGROUND HEARTS ── */
  .bg-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .bg-heart {
    position: absolute;
    bottom: -80px;
    font-size: 1.4rem;
    animation: floatUp linear infinite;
    opacity: 0;
    user-select: none;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
    10%  { opacity: 0.55; }
    85%  { opacity: 0.4; }
    100% { transform: translateY(-110vh) rotate(25deg) scale(1.2); opacity: 0; }
  }

  /* ── SPARKLE DOTS ── */
  .sparkle {
    position: fixed;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rose);
    pointer-events: none;
    z-index: 0;
    animation: sparkleFloat ease-in-out infinite alternate;
    opacity: 0.35;
  }

  @keyframes sparkleFloat {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-18px) scale(1.5); }
  }

  /* ── MAIN CARD ── */
  .card {
    position: relative;
    z-index: 10;
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(1.6);
    -webkit-backdrop-filter: blur(22px) saturate(1.6);
    border-radius: 32px;
    padding: 3rem 2.8rem 2.4rem;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.8);
    animation: cardEntrance 0.9s cubic-bezier(.22,1.2,.36,1) both;
  }

  @keyframes cardEntrance {
    from { opacity: 0; transform: translateY(40px) scale(0.93); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Decorative top ribbon */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #f9a8d4, #ec4899);
    border-radius: 50%;
    box-shadow: 0 4px 20px rgba(236,72,153,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-icon {
    position: absolute;
    top: -36px; left: 50%;
    transform: translateX(-50%);
    font-size: 2.4rem;
    animation: iconPulse 1.8s ease-in-out infinite;
    z-index: 12;
    filter: drop-shadow(0 4px 10px rgba(236,72,153,0.55));
  }

  @keyframes iconPulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50%       { transform: translateX(-50%) scale(1.18); }
  }

  .card-tag {
    display: inline-block;
    background: linear-gradient(90deg, #fce7f3, #ede9fe);
    border: 1px solid #f9a8d4;
    color: var(--rose-deep);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border-radius: 100px;
    padding: 0.28rem 1rem;
    margin-bottom: 1.2rem;
    margin-top: 0.6rem;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.7rem, 5vw, 2.5rem);
    font-weight: 700;
    color: #be185d;
    line-height: 1.25;
    margin-bottom: 0.85rem;
    letter-spacing: -0.01em;
  }

  h1 span.shimmer {
    background: linear-gradient(90deg, #ec4899, #f472b6, #a855f7, #ec4899);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmerText 3s linear infinite;
  }

  @keyframes shimmerText {
    from { background-position: 0%; }
    to   { background-position: 200%; }
  }

  .subtitle {
    font-size: 0.95rem;
    color: #9d4e6e;
    font-weight: 400;
    line-height: 1.6;
    margin-bottom: 2.2rem;
    opacity: 0.88;
  }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 2rem;
    opacity: 0.5;
  }
  .divider span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #f9a8d4, transparent); }
  .divider .dot { font-size: 0.7rem; }

  /* ── BUTTONS ── */
  .btn-group {
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
  }

  .btn-yes {
    position: relative;
    overflow: hidden;
    padding: 0.85rem 2.4rem;
    border: none;
    border-radius: 100px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #f472b6 0%, #ec4899 50%, #db2777 100%);
    cursor: pointer;
    box-shadow: 0 6px 28px rgba(236,72,153,0.45), 0 2px 8px rgba(236,72,153,0.2);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.04em;
    animation: glowPulse 2.4s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 6px 28px rgba(236,72,153,0.45), 0 0 0 0 rgba(236,72,153,0.3); }
    50%       { box-shadow: 0 6px 32px rgba(236,72,153,0.6), 0 0 0 10px rgba(236,72,153,0); }
  }

  .btn-yes:hover { transform: translateY(-3px) scale(1.04); }
  .btn-yes:active { transform: scale(0.97); }

  .btn-yes::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 60%);
    border-radius: inherit;
    pointer-events: none;
  }

  /* NO button – absolutely positioned for escape */
  .btn-no-wrapper {
    position: relative;
    width: 130px;
    height: 48px;
    flex-shrink: 0;
  }

  .btn-no {
    position: fixed; /* will be repositioned by JS */
    padding: 0.85rem 1.8rem;
    border: 1.5px solid #f9a8d4;
    border-radius: 100px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #be185d;
    background: rgba(255,255,255,0.7);
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: transform 0.35s cubic-bezier(.22,1.4,.36,1), box-shadow 0.2s;
    letter-spacing: 0.03em;
    white-space: nowrap;
    z-index: 9999;
    box-shadow: 0 2px 12px rgba(236,72,153,0.12);
  }

  .btn-no:hover {
    box-shadow: 0 4px 16px rgba(236,72,153,0.18);
  }

  /* ── SUCCESS MESSAGE ── */
  .success-msg {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    animation: successPop 0.6s cubic-bezier(.22,1.4,.36,1) both;
  }

  @keyframes successPop {
    from { opacity: 0; transform: scale(0.7) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .success-msg .big-emoji {
    font-size: 3rem;
    animation: bounceEmoji 0.8s cubic-bezier(.22,1.6,.36,1) both;
  }

  @keyframes bounceEmoji {
    from { transform: scale(0); }
    to   { transform: scale(1) rotate(-5deg); }
  }

  .success-msg h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: #be185d;
    font-style: italic;
  }

  .success-msg p {
    font-size: 0.9rem;
    color: #9d4e6e;
  }

  /* ── BURST HEARTS (explosion) ── */
  .burst-heart {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 1.5rem;
    animation: burstFly 1.2s ease-out forwards;
    user-select: none;
  }

  @keyframes burstFly {
    0%   { transform: translate(0,0) scale(0.5) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--rot)); opacity: 0; }
  }

  /* ── FOOTER ── */
  footer {
    margin-top: 1.8rem;
    font-size: 0.75rem;
    color: #c084a0;
    letter-spacing: 0.06em;
    z-index: 10;
    opacity: 0.7;
    animation: fadeInUp 1.2s 0.6s ease both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 0.7; transform: translateY(0); }
  }

  /* ── MOBILE ── */
  @media (max-width: 480px) {
    .card { padding: 2.4rem 1.6rem 2rem; border-radius: 24px; }
    h1 { font-size: 1.55rem; }
    .btn-group { gap: 0.9rem; }
  }
</style>
</title><head><body>

<!-- Background hearts layer -->
<div class="bg-hearts" id="bgHearts"></div><div>
<!-- Main card -->
<div class="card" id="mainCard">
  <div class="card-icon">💖</div><div>  <div class="card-tag">✨ A sweet question for you ✨</div><div>
  <div id="question-block">
    <h1><span class="shimmer">Will You Go Out With Me?</span>span> ❤️</h1><h1>    <p class="subtitle">I promise this could be the beginning of something beautiful 😊</p><p>
    <div class="divider">
      <span></span>span><span class="dot">💕</span><span></span><span>    </span><div>
    <div class="btn-group" id="btnGroup">
      <button class="btn-yes" id="btnYes">Yes, definitely! 💖</button>
      <div class="btn-no-wrapper" id="noWrapper">
        <!-- placeholder for layout; real button is fixed-positioned -->
      </div><div>    </div><div>  </div><div>
  <!-- Success message (hidden until YES clicked) -->
  <div class="success-msg" id="successMsg">
    <div class="big-emoji">🥰</div><div>    <h2>Yaaay!</h2><h2>    <p>You just made my day 💖</p><p>    <p style="margin-top:.4rem; font-size:.82rem; opacity:.7;">This is going to be wonderful ✨</p><p>  </p><div></div><div>
<footer>Made with courage by Joshua ✨</footer><footer>
<!-- Fixed NO button (outside card so it can escape anywhere) -->
<button class="btn-no" id="btnNo">Nope 🙈</button>

<script>
(function(){
  /* ── 1. BACKGROUND FLOATING HEARTS ── */
  const emojis = ['💖','💗','💝','💘','🌸','✨','💕','🩷','💞'];
  const bgEl = document.getElementById('bgHearts');

  function createBgHeart(){
    const h = document.createElement('span');
    h.className = 'bg-heart';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const leftPct = Math.random()*100;
    const dur = 8 + Math.random()*12;
    const delay = Math.random()*8;
    const size = 0.8 + Math.random()*1.6;
    h.style.cssText = `left:${leftPct}%;font-size:${size}rem;animation-duration:${dur}s;animation-delay:${delay}s;`;
    bgEl.appendChild(h);
    setTimeout(()=>h.remove(), (dur+delay)*1000 + 500);
  }

  for(let i=0;i<18;i++) createBgHeart();
  setInterval(createBgHeart, 900);

  /* ── 2. SPARKLE DOTS ── */arguments  for(let i=0;i<12;i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.cssText = `
      left:${Math.random()*100}vw;
      top:${Math.random()*100}vh;
      width:${3+Math.random()*5}px;
      height:${3+Math.random()*5}px;
      animation-duration:${2+Math.random()*3}s;
      animation-delay:${Math.random()*3}s;
      background:${['#f9a8d4','#c084fc','#fbbf24','#86efac'][Math.floor(Math.random()*4)]};
    `;
    document.body.appendChild(s);
  }

  /* ── 3. NO BUTTON ESCAPE LOGIC ── */
  const btnNo = document.getElementById('btnNo');
  const noWrapper = document.getElementById('noWrapper');

  // Position NO button over its wrapper slot initially
  function syncNoButton(){
    const rect = noWrapper.getBoundingClientRect();
    btnNo.style.left = rect.left + 'px';
    btnNo.style.top  = rect.top  + 'px';
    btnNo.style.width = rect.width + 'px';
    btnNo.style.height = rect.height + 'px';
  }

  syncNoButton();
  window.addEventListener('resize', syncNoButton);
  window.addEventListener('scroll', syncNoButton);

  let escaped = false;

  function getRandomPos(){
    const btnW = btnNo.offsetWidth  || 120;
    const btnH = btnNo.offsetHeight || 48;
    const margin = 20;
    const x = margin + Math.random() * (window.innerWidth  - btnW - margin*2);
    const y = margin + Math.random() * (window.innerHeight - btnH - margin*2);
    return { x, y };
  }

  function escapeFrom(mx, my){
    if(escaped) return;
    const rect = btnNo.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top  + rect.height/2;
    const dx = cx - mx;
    const dy = cy - my;

    // Try to move AWAY from the cursor
    let attempts = 0;
    let best;
    while(attempts < 10){
      const pos = getRandomPos();
      const nx = pos.x + (btnNo.offsetWidth||120)/2;
      const ny = pos.y + (btnNo.offsetHeight||48)/2;
      const score = (nx-mx)*(nx-mx) + (ny-my)*(ny-my);
      if(!best || score > best.score){
        best = { pos, score };
      }
      // Prefer positions in opposite quadrant
      if(dx > 0 && nx > mx && dy > 0 && ny > my) continue;
      attempts++;
    }

    const { pos } = best;
    btnNo.style.transition = 'left 0.38s cubic-bezier(.22,1.4,.36,1), top 0.38s cubic-bezier(.22,1.4,.36,1)';
    btnNo.style.left = pos.x + 'px';
    btnNo.style.top  = pos.y + 'px';
  }

  // Desktop: mousemove proximity check
  document.addEventListener('mousemove', e => {
    const rect = btnNo.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top  + rect.height/2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    if(dist < 90) escapeFrom(e.clientX, e.clientY);
  });

  // Mobile: touchmove
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    const rect = btnNo.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top  + rect.height/2;
    const dist = Math.hypot(t.clientX - cx, t.clientY - cy);
    if(dist < 120) escapeFrom(t.clientX, t.clientY);
  }, { passive: true });

  // Click / tap fallback escape
  btnNo.addEventListener('click', e => { escapeFrom(e.clientX, e.clientY); e.preventDefault(); });
  btnNo.addEventListener('touchstart', e => {
    const t = e.touches[0];
    escapeFrom(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  /* ── 4. YES BUTTON ── */arguments  const btnYes = document.getElementById('btnYes');

  function burstHearts(x, y){
    const heartSet = ['💖','💗','💝','💘','✨','🩷','💞','🌸','💓'];
    for(let i=0; i<22; i++){
      const h = document.createElement('span');
      h.className = 'burst-heart';
      const angle = (i/22)*Math.PI*2;
      const dist  = 60 + Math.random()*120;
      const dx    = Math.cos(angle)*dist + (Math.random()-0.5)*60;
      const dy    = Math.sin(angle)*dist + (Math.random()-0.5)*60 - 40;
      const rot   = (Math.random()-0.5)*120 + 'deg';
      h.style.setProperty('--dx', dx+'px');
      h.style.setProperty('--dy', dy+'px');
      h.style.setProperty('--rot', rot);
      h.style.left = (x - 12) + 'px';
      h.style.top  = (y - 12) + 'px';
      h.style.animationDuration = (0.9 + Math.random()*0.6)+'s';
      h.textContent = heartSet[Math.floor(Math.random()*heartSet.length)];
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 1600);
    }
  }

  btnYes.addEventListener('click', e => {
    escaped = true;

    // Burst from button centre
    const rect = btnYes.getBoundingClientRect();
    burstHearts(rect.left + rect.width/2, rect.top + rect.height/2);

    // Fade out question, show success
    const qBlock = document.getElementById('question-block');
    const sMsg   = document.getElementById('successMsg');
    qBlock.style.transition = 'opacity 0.4s';
    qBlock.style.opacity = '0';
    setTimeout(()=>{
      qBlock.style.display = 'none';
      btnNo.style.display  = 'none';
      sMsg.style.display   = 'flex';
    }, 420);

    // Second burst after message appears
    setTimeout(()=>{
      burstHearts(window.innerWidth/2, window.innerHeight/2);
    }, 700);
  });

})();
</script>
</body>
</html></button></footer></footer></div></div></p></p></p></h2></h2></div></div></div></div></div></button></div></span></span></div></p></p></h1></span></h1></div></div></div></div></head></style></title></title></head></html>
